# Flatpak manifest for GP Client — the GUI only. The privileged backend
# (gpservice: openconnect + tun) can't be sandboxed; it ships as a host .deb/.rpm
# and is reached over D-Bus (--system-talk-name below). The in-app "backend not
# installed" screen guides the host install.
#
# Smart-card / YubiKey:
#   * --socket=pcsc bridges the host pcscd into the sandbox (no USB passthrough),
#     which is what makes PKCS#11 work.
#   * The runtime has no opensc, so pcsc-lite (client lib) + opensc are bundled;
#     the module lands at /app/lib/pkcs11/opensc-pkcs11.so and pkcs11-tool at
#     /app/bin — both of which gp-client's pkcs11.rs probes for.
#
# Build with packaging/flatpak/flatpak-build.sh, which installs the runtime/SDK,
# vendors the cargo registry (cargo-sources.json), and runs flatpak-builder.
app-id: io.github.techneut92.GPClient
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gp-client

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # webkit2gtk's DMABUF renderer crashes on some Wayland + Mesa setups.
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  # Update check hits the GitHub Releases API.
  - --share=network
  # Smart card: talk to the host pcscd (YubiKey PIV).
  - --socket=pcsc
  # The root backend, over the system bus.
  - --system-talk-name=io.github.techneut92.GPService
  # "Remember unlock" — store the master PIN in the desktop secret store.
  - --talk-name=org.freedesktop.secrets
  # Desktop integration: notifications + system-tray (SNI).
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Portals: file chooser (cert-file auth) + OpenURI (system-browser SSO).
  - --talk-name=org.freedesktop.portal.Desktop
  # Run host commands (flatpak update / pkexec backend install / xdg-open) via
  # flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
  # Write the host autostart entry and the Pop Shell float-rule (best-effort).
  - --filesystem=xdg-config/autostart:create
  - --filesystem=xdg-config/pop-shell:create
  # One-time, read-only: import settings from the predecessor gpgui on first run.
  - --filesystem=~/.var/app/io.github.techneut92.gpgui:ro

modules:
  # libpcsclite client (to reach host pcscd via --socket=pcsc). The client/socket
  # protocol is stable, so an older release is fine against a newer host pcscd.
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dlibudev=false
      - -Dpolkit=false
    # Ship the BSD-3-Clause license text with the bundled binary. meson builds
    # out-of-tree in _flatpak_build/, so COPYING is one directory up.
    post-install:
      - install -Dm644 ../COPYING /app/share/licenses/pcsc-lite/COPYING
    sources:
      # Git tag rather than the apdu.fr tarball: that server keeps only the
      # latest two releases, so a pinned tarball 404s on the next release. pcsc-lite
      # uses meson since 2.x, which builds straight from a git checkout — and tags
      # don't disappear.
      - type: git
        url: https://salsa.debian.org/rousseau/PCSC.git
        tag: '2.5.1'
        commit: 5b93c58217f3633800264f68054f58c211090b45

  # opensc — provides /app/lib/pkcs11/opensc-pkcs11.so and /app/bin/pkcs11-tool
  - name: opensc
    config-opts:
      - --disable-static
    # GCC 14 (fdo 25.08 SDK) promotes several legacy-C warnings to errors; opensc
    # 0.26.0 still trips them, so don't treat warnings as errors.
    build-options:
      cflags: -Wno-error
      # Point opensc straight at the pcsc-lite we built above, instead of relying
      # on pkg-config auto-detection (which intermittently failed to find
      # winscard.h on x86_64 CI runners).
      env:
        PCSC_CFLAGS: -I/app/include/PCSC
        PCSC_LIBS: -L/app/lib -lpcsclite
    # bash-completion's pkg-config dir resolves to the read-only /usr; redirect it
    # into the app prefix.
    make-install-args:
      - completiondir=/app/share/bash-completion/completions
    # Ship the LGPL-2.1+ license text with the bundled module.
    post-install:
      - install -Dm644 COPYING /app/share/licenses/opensc/COPYING
    sources:
      - type: archive
        url: https://github.com/OpenSC/OpenSC/releases/download/0.26.0/opensc-0.26.0.tar.gz
        sha256: 837baead45e1505260d868871056150ede6e73d35460a470f2595a9e5e75f82b

  - name: gp-client
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/gp-client/cargo
        # Baked into the binary so About shows the build kind unambiguously.
        GP_BUILD_KIND: flatpak
    build-commands:
      # --features custom-protocol: embed the frontend (production mode). Without
      # it the app runs in dev mode and tries to load the UI from localhost:5173.
      - cargo build --release --offline --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/gp-client /app/bin/gp-client
      - install -Dm644 packaging/flatpak/io.github.techneut92.GPClient.desktop /app/share/applications/io.github.techneut92.GPClient.desktop
      - install -Dm644 packaging/flatpak/io.github.techneut92.GPClient.metainfo.xml /app/share/metainfo/io.github.techneut92.GPClient.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.techneut92.GPClient.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.techneut92.GPClient/LICENSE
    sources:
      - type: dir
        # Repo root (three levels up from this manifest). Skip heavy/irrelevant
        # trees so the sandbox copy stays small. dist/ (the prebuilt frontend)
        # is kept — tauri-build embeds it at compile time.
        path: ../../
        skip:
          - src-tauri/target
          - .git
          - ui/node_modules
          - .flatpak-builder
          - build-flatpak
      # Vendored crate registry for the offline build (generated; see header).
      - cargo-sources.json
