name: Release

# Build every distributable format for gp-client and attach them to a GitHub
# Release. Publishing to COPR (.rpm) / OBS (.deb) is a separate, later step —
# this workflow only *builds* the artifacts.
#
# Formats × arches:
#   - .deb / .rpm / AppImage  — via `tauri build` (x86_64 + aarch64)
#   - .flatpak                — via flatpak-builder (x86_64 + aarch64)
#   - Arch .pkg.tar.zst       — in an archlinux container (x86_64)
#   - Alpine .apk             — in an alpine container (x86_64)
#
# NOTE: CI can't be validated locally — expect a first-run shakeout. Trigger it
# with a `v*` tag, or manually via workflow_dispatch.

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Native bundles produced by Tauri itself: .deb, .rpm and AppImage.
  # ---------------------------------------------------------------------------
  tauri-bundles:
    name: bundles (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Tauri v2 / WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            rpm \
            file

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build bundles (.deb, .rpm, AppImage)
        # `tauri build` must run from the repo root — it locates src-tauri/ as a
        # subfolder (it does not search parents). It runs `pnpm -C ui build`
        # (beforeBuildCommand) for the frontend, then compiles in production mode
        # (custom-protocol) so the embedded frontend is used.
        run: ui/node_modules/.bin/tauri build --bundles deb,rpm,appimage

      - name: Collect artifacts
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts

      # Release notes = this version's CHANGELOG section (so the release body isn't
      # the tag's commit message). Only this job sets the body; the other matrix
      # jobs just append assets, which preserves it.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]"{p=1;print;next} /^## \[/{if(p)exit} p' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "GP Client ${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      # Attach straight to the GitHub Release (tag builds). Release assets don't
      # count against the tiny Actions artifact-storage quota; matrix jobs all
      # append to the same release.
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Flatpak — built from the committed manifest + cargo-sources.json.
  # ---------------------------------------------------------------------------
  flatpak:
    name: flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build the frontend (ui/dist/)
        working-directory: ui
        # The flatpak manifest embeds the prebuilt ui/dist/ (tauri-build reads it
        # at compile time); build it before flatpak-builder runs.
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build the Flatpak bundle
        run: |
          flatpak install -y --user flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo build-dir \
            packaging/flatpak/io.github.techneut92.GPClient.yml
          flatpak build-bundle flatpak-repo \
            "io.github.techneut92.GPClient-${{ matrix.arch }}.flatpak" \
            io.github.techneut92.GPClient master

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.flatpak'
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Flathub source tarball. Flathub builds fully offline, so it can't run
  # `pnpm build` — the manifest fetches this asset, which bundles the committed
  # source (incl. src-tauri/Cargo.lock) plus the prebuilt frontend (ui/dist/).
  # The Flathub manifest pins it by URL + sha256; after the release publishes
  # this file, fill the manifest's sha256 from it (scripts/flathub-sha256.sh).
  # ---------------------------------------------------------------------------
  flathub-tarball:
    name: flathub source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build the frontend (ui/dist/)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble the source tarball
        # git archive gives the clean committed tree (incl. src-tauri/Cargo.lock);
        # ui/dist/ is a build output (gitignored), so add it on top. Everything
        # lands under a gp-client-<version>/ prefix that flatpak-builder strips.
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          prefix="gp-client-${version}"
          staging="$(mktemp -d)"
          git archive --prefix="${prefix}/" --format=tar HEAD | tar -x -C "$staging"
          mkdir -p "$staging/${prefix}/ui"
          cp -r ui/dist "$staging/${prefix}/ui/dist"
          tar -C "$staging" -czf "${prefix}-flathub.tar.gz" "${prefix}"
          echo "sha256 (fill this into the Flathub manifest):"
          sha256sum "${prefix}-flathub.tar.gz"

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gp-client-*-flathub.tar.gz
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Arch Linux package (.pkg.tar.zst) — built in an archlinux container.
  # ---------------------------------------------------------------------------
  arch:
    name: arch (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            image: archlinux:latest
          # The official archlinux image is x86_64-only; Arch Linux ARM ships as
          # a separate image.
          - runner: ubuntu-24.04-arm
            arch: aarch64
            image: menci/archlinuxarm:latest
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install build tooling
        run: |
          # pacman 7's download sandbox (Landlock) can't initialize inside the
          # ARM container; disable it so pacman works on both arches.
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm --needed \
            base-devel git rust nodejs pnpm \
            webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg \
            opensc pcsclite openssl pkgconf

      - uses: actions/checkout@v6

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # makepkg refuses to run as root; build under a non-privileged user.
      - name: Prepare builder user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          cp packaging/arch/PKGBUILD .
          su builder -c "makepkg -f --noconfirm"

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Arch Linux ARM defaults to .pkg.tar.xz, x86 Arch to .pkg.tar.zst.
          files: '*.pkg.tar.*'
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Alpine package (.apk). Checkout runs on the host (JavaScript actions can't
  # run inside an Alpine/musl container on arm64), then the build runs in a
  # manually-invoked Alpine container.
  # ---------------------------------------------------------------------------
  apk:
    name: apk (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Build .apk in an Alpine container
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:latest sh -euc '
            # Enable community (opensc / pcsc-lite live there) and refresh the index.
            . /etc/os-release
            v=$(echo "$VERSION_ID" | cut -d. -f1,2)
            printf "%s\n" \
              "https://dl-cdn.alpinelinux.org/alpine/v$v/main" \
              "https://dl-cdn.alpinelinux.org/alpine/v$v/community" \
              > /etc/apk/repositories
            apk update
            apk add --no-cache \
              alpine-sdk git cargo nodejs npm \
              webkit2gtk-4.1-dev gtk+3.0-dev libayatana-appindicator-dev \
              librsvg-dev openssl-dev \
              opensc pcsc-lite
            npm install -g pnpm

            adduser -D builder
            addgroup builder abuild
            chown -R builder:builder /src
            git config --global --add safe.directory /src

            su builder -c "abuild-keygen -a -n"
            # Trust the freshly generated key so abuild can sign + index the repo.
            cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
            su builder -c "
              cd /src/packaging/alpine
              REPODEST=/src/apk-out abuild -r
            "
          '

      # abuild names the .apk without the arch, so both matrix arches produce the
      # same filename and would clobber each other on the release. Label per arch.
      - name: Label apk by arch
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          shopt -s globstar nullglob
          for f in apk-out/**/*.apk; do
            case "$f" in *-${{ matrix.arch }}.apk) continue;; esac
            mv "$f" "${f%.apk}-${{ matrix.arch }}.apk"
          done
          ls -la apk-out/**/*.apk

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/**/*.apk
          fail_on_unmatched_files: true
